<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>나만의 AI 메신저</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;justify-content:center}
button,input,textarea,select{font:inherit}.app{width:100%;max-width:480px;height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;min-height:0;flex-direction:column}.screen.active{display:flex}header{background:#fee500;padding:14px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.body{flex:1;overflow:auto;padding:14px}.nav{height:60px;border-top:1px solid #ddd;display:none}.nav.show{display:flex}.nav button{flex:1;border:0;background:#fafafa;font-size:12px}.nav button.active{font-weight:700;color:#000}
.card{background:#f8f8f8;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:70px;resize:vertical}
.primary,.secondary,.danger{border:0;border-radius:8px;padding:11px 14px;font-weight:700}.primary{background:#fee500}.secondary{background:#ddd}.danger{background:#ff3b30;color:#fff}.rowbtn{display:flex;gap:8px}.rowbtn>*{flex:1}
.list{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer}.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#ddd;margin-right:12px}.info{flex:1;min-width:0}.name{font-weight:700}.sub{font-size:12px;color:#777;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat{background:#b2c7d9}.chathead{padding:9px 12px;display:flex;align-items:center;gap:8px}.chathead img{width:38px;height:38px;border-radius:50%;object-fit:cover}.chathead .title{flex:1;font-weight:700}.icon{border:0;background:transparent;font-size:20px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.msgrow{display:flex;align-items:flex-end;gap:6px;max-width:85%}.msgrow.recv{align-self:flex-start}.msgrow.sent{align-self:flex-end;flex-direction:row-reverse}.mini{width:32px;height:32px;border-radius:50%;object-fit:cover}.bubble{padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}.recv .bubble{background:#fff;border-top-left-radius:3px}.sent .bubble{background:#ffeb33;border-top-right-radius:3px}.bubble img{max-width:240px;border-radius:10px;display:block}.time{font-size:10px;color:rgba(0,0,0,.45);margin:2px 4px}.typing{display:none;align-self:flex-start;margin-left:40px;background:#fff;padding:9px 12px;border-radius:14px;font-size:12px;color:#777}.typing.show{display:block}
.composer{display:flex;gap:7px;padding:9px;background:#f1f1f1;padding-bottom:max(9px,env(safe-area-inset-bottom))}.composer input{flex:1;min-width:0;border:0;border-radius:20px;padding:10px 13px;font-size:16px}.composer button{border:0;border-radius:18px;padding:0 13px}.plus{background:#ddd}.send{background:#fee500;font-weight:700}
.modal,.drawer,.emoji{position:fixed;inset:0;display:none;z-index:20}.modal.show,.emoji.show{display:flex}.modal,.emoji{background:rgba(0,0,0,.45);align-items:center;justify-content:center}.modalbox{width:90%;max-width:410px;max-height:88vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.drawer{left:auto;width:82%;max-width:330px;background:#fff;padding:18px;overflow:auto;box-shadow:-4px 0 14px #0002}.drawer.show{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.emojiBtn{font-size:26px;border:0;background:#f5f5f5;border-radius:10px;padding:10px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.badge{background:#ff3b30;color:#fff;border-radius:10px;padding:2px 6px;font-size:10px}.note{font-size:11px;color:#777;line-height:1.45}.preview{width:70px;height:70px;border-radius:50%;object-fit:cover;display:none;margin-top:6px}.preview.rect{width:110px;border-radius:8px}
.banner{position:fixed;left:50%;top:-100px;transform:translateX(-50%);width:90%;max-width:440px;background:#fffffff2;border-radius:14px;box-shadow:0 6px 20px #0003;padding:11px;z-index:50;display:flex;gap:10px;align-items:center;transition:.35s}.banner.show{top:14px}.banner img{width:40px;height:40px;border-radius:50%;object-fit:cover}
</style>
</head>
<body>
<div id="banner" class="banner"><img id="banAv"><div><b id="banName"></b><div id="banText" class="sub"></div></div></div>
<div class="app">

<section id="friends" class="screen active"><header><span>친구</span><button id="addFriend" class="icon">➕</button></header><div id="friendList" class="body"></div></section>
<section id="chats" class="screen"><header>대화</header><div id="chatList" class="body"></div></section>
<section id="gallery" class="screen"><header>공유된 갤러리</header><div id="galleryBody" class="body"></div></section>

<section id="settings" class="screen"><header>설정</header><div class="body">
<div class="card"><b>🔔 알림</b><div class="field"><label>알림 기능</label><select id="notifOn"><option value="on">켜기</option><option value="off">끄기</option></select></div><div class="field"><label>미리보기</label><select id="notifPreview"><option value="content">내용 표시</option><option value="hidden">내용 숨기기</option></select></div><div class="note">현재는 웹앱이 열려 있을 때 표시되는 인앱 알림입니다.</div></div>
<div class="card"><b>👤 내 인물 설정</b><div class="field"><label>닉네임</label><input id="uName"></div><div class="field"><label>나이</label><select id="uAge"><option>10대</option><option value="20대초반">20대 초반</option><option value="20대후반">20대 후반</option><option>30대</option><option>40대 이상</option></select></div><div class="field"><label>지역</label><select id="uRegion"><option>서울</option><option>경기/인천</option><option>부산/경상</option><option>대구/경북</option><option>광주/전라</option><option>기타</option></select></div><div class="field"><label>성별</label><select id="uGender"><option>여성</option><option>남성</option><option>기타</option></select></div><button id="saveUser" class="primary" style="width:100%">저장</button></div>
<div class="card"><b>📜 전역 AI 시스템 프롬프트</b><div class="field"><textarea id="globalPrompt"></textarea></div><button id="savePrompt" class="primary" style="width:100%">저장</button></div>
<div class="card"><b>😊 이모티콘 팩</b><div class="field"><input id="emojiPack"></div><button id="saveEmoji" class="primary" style="width:100%">저장</button></div>
<div class="card"><b>🔑 Gemini API</b><div class="field"><label>API 키</label><input id="apiKey" type="password"></div><div class="field"><label>대화 모델</label><select id="model"><option value="gemini-3.7-flash">Gemini 3.7 Flash</option><option value="gemini-3.6-flash">Gemini 3.6 Flash</option><option value="gemini-3.5-flash">Gemini 3.5 Flash</option><option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option></select></div><button id="saveApi" class="primary" style="width:100%">API 설정 저장</button><div id="apiState" class="note" style="margin-top:8px"></div><div class="note">API 키는 GitHub 코드에 포함되지 않고, 이 브라우저의 localStorage에만 저장됩니다. 개인용으로 사용하고 웹앱 주소를 공유하지 않는 용도에 적합합니다.</div></div>
<div class="card"><b>📱 웹앱 타이틀</b><div class="field"><input id="titleInput"></div><button id="saveTitle" class="primary" style="width:100%">변경</button></div>
</div></section>

<section id="chat" class="screen"><div class="chathead"><button id="back" class="icon">〈</button><img id="chatAv"><div id="chatName" class="title"></div><button id="menu" class="icon">≡</button></div><div id="msgs" class="msgs"></div><div id="typing" class="typing">입력 중...</div><input id="photoInput" type="file" accept="image/*" hidden><div class="composer"><button id="photo" class="plus">＋</button><input id="text" placeholder="메시지를 입력하세요..."><button id="emojib" class="plus">😊</button><button id="send" class="send">전송</button></div></section>

<nav id="nav" class="nav show"><button data-s="friends" class="active">👥<br>친구</button><button data-s="chats">💬<br>대화 <span id="unreadTotal"></span></button><button data-s="gallery">🖼️<br>갤러리</button><button data-s="settings">⚙️<br>설정</button></nav>
</div>

<div id="friendModal" class="modal"><div class="modalbox"><h3 id="fmTitle">새 친구</h3><input id="editId" type="hidden">
<div class="field"><label>이름</label><input id="fName"></div><div class="field"><label>상태 메시지</label><input id="fStatus"></div>
<div class="field"><label>나이</label><select id="fAge"><option>10대</option><option value="20대초반">20대 초반</option><option value="20대후반">20대 후반</option><option>30대</option><option>40대 이상</option></select></div>
<div class="field"><label>지역</label><select id="fRegion"><option>서울</option><option>경기/인천</option><option>부산/경상</option><option>대구/경북</option><option>광주/전라</option><option>기타</option></select></div>
<div class="field"><label>성별</label><select id="fGender"><option>여성</option><option>남성</option><option>기타</option></select></div>
<div class="field"><label>프로필 사진</label><input id="fAvatar" type="file" accept="image/*"><img id="avPrev" class="preview"></div>
<div class="field"><label>배경 사진</label><input id="fBg" type="file" accept="image/*"><img id="bgPrev" class="preview rect"></div>
<div class="field"><label>외형 고정 사항</label><textarea id="appearance"></textarea></div>
<div class="field"><label>외형 참조 이미지</label><input id="fRef" type="file" accept="image/*"><img id="refPrev" class="preview"></div>
<div class="field"><label>의상 설정 방식</label><select id="outfitMode"><option value="fixed">고정</option><option value="auto">상황에 맞게 변경</option></select></div>
<div class="field"><label>의상 취향 / 스타일</label><input id="outfitStyle"></div>
<div class="field"><label>성격 및 페르소나</label><textarea id="persona"></textarea></div>
<div class="field"><label>말풍선 스타일</label><select id="bubbleStyle"><option value="short">짧게 여러 말풍선</option><option value="long">한 말풍선으로 길게</option></select></div>
<div class="field"><label>⏰ 선톡</label><select id="autoMsg"><option value="on">켜기</option><option value="off">끄기</option></select><div class="note">웹앱이 열려 있을 때 일정 시간 대화가 없으면 작동합니다.</div></div>
<div class="field"><label>🖼️ 자율 이미지 생성</label><select id="autoImg"><option value="off">끄기</option><option value="on">켜기</option></select><div class="note">켜면 대화 후 드물게 상황에 맞는 이미지를 생성합니다.</div></div>
<div class="field"><label>🧠 기억 요약본</label><textarea id="memory"></textarea></div>
<div class="rowbtn"><button id="fmCancel" class="secondary">취소</button><button id="fmSave" class="primary">저장</button></div></div></div>

<div id="drawer" class="drawer"><button id="drawerClose" class="secondary" style="float:right">닫기</button><h3>채팅방 설정</h3><div class="field"><label>행동 괄호 묘사</label><select id="actionOn"><option value="on">켜기</option><option value="off">끄기</option></select></div><div class="field"><label>톡 정지</label><select id="pauseOn"><option value="off">정상 대화</option><option value="on">일시 정지</option></select></div><div class="field"><label>시간 흐름</label><select id="timeMode"><option value="real">실시간</option><option value="fast">시간 가속</option></select></div><div class="field"><label>기념일 설명</label><input id="ddayDesc"></div><div class="field"><label>기념일 날짜</label><input id="ddayDate" type="date"></div><div id="ddayInfo" class="note"></div><button id="saveRoom" class="primary" style="width:100%;margin-top:10px">채팅방 설정 저장</button><button id="deleteFriend" class="danger" style="margin-top:20px">친구 삭제</button></div>

<div id="emojiModal" class="emoji"><div class="modalbox"><h3>이모티콘</h3><div id="emojiGrid" class="grid"></div><button id="emojiClose" class="secondary" style="width:100%;margin-top:12px">닫기</button></div></div>

<script>
(()=>{
const $=id=>document.getElementById(id),J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const K={F:'aim_friends3',H:'aim_hist3',U:'aim_unread3',T:'aim_title',ME:'aim_me',SYS:'aim_sys',E:'aim_emoji',N:'aim_notif',KEY:'gemini_api_key',M:'gemini_model'};
const blank='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" fill="#ddd"/><circle cx="80" cy="58" r="30" fill="#aaa"/><ellipse cx="80" cy="130" rx="50" ry="40" fill="#aaa"/></svg>');
let friends=J(K.F,[]),hist=J(K.H,{}),unread=J(K.U,{}),title=localStorage.getItem(K.T)||'나만의 AI 메신저',me=J(K.ME,{name:'유저',age:'20대초반',region:'서울',gender:'여성'}),sys=localStorage.getItem(K.SYS)||'AI라는 사실을 굳이 언급하지 말고 메신저 친구처럼 자연스럽고 일관되게 대화한다.',emojis=J(K.E,['😀','🥹','💖','🔥','😭','☕','👍','🥰','✨','👀']),notif=J(K.N,{on:'on',preview:'content'}),fid=null,tmp={av:blank,bg:blank,ref:''},lastAct=Date.now(),autoBusy=false;
const save=()=>{localStorage.setItem(K.F,JSON.stringify(friends));localStorage.setItem(K.H,JSON.stringify(hist));localStorage.setItem(K.U,JSON.stringify(unread))},friend=id=>friends.find(f=>String(f.id)===String(id)),time=()=>{let d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'),ap=h>=12?'오후':'오전';return `${ap} ${h%12||12}:${m}`},delay=x=>new Promise(r=>setTimeout(r,x));
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function init(){document.title=title;$('titleInput').value=title;$('uName').value=me.name;$('uAge').value=me.age;$('uRegion').value=me.region;$('uGender').value=me.gender;$('globalPrompt').value=sys;$('emojiPack').value=emojis.join(', ');$('notifOn').value=notif.on;$('notifPreview').value=notif.preview;$('apiKey').value=localStorage.getItem(K.KEY)||'';$('model').value=localStorage.getItem(K.M)||'gemini-3.7-flash';apiState();renderFriends();renderChats();renderGallery();
$('addFriend').onclick=()=>openFM();$('back').onclick=()=>{fid=null;showScreen('friends');$('nav').classList.add('show');renderFriends();renderChats()};$('menu').onclick=openDrawer;$('drawerClose').onclick=()=>$('drawer').classList.remove('show');$('photo').onclick=()=>$('photoInput').click();$('photoInput').onchange=sendPhoto;$('emojib').onclick=()=>openEmoji();$('emojiClose').onclick=()=>$('emojiModal').classList.remove('show');$('send').onclick=sendText;$('text').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendText()}};$('text').oninput=()=>lastAct=Date.now();
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showScreen(b.dataset.s);if(b.dataset.s==='friends')renderFriends();if(b.dataset.s==='chats')renderChats();if(b.dataset.s==='gallery')renderGallery()});
$('saveUser').onclick=()=>{me={name:$('uName').value.trim()||'유저',age:$('uAge').value,region:$('uRegion').value,gender:$('uGender').value};localStorage.setItem(K.ME,JSON.stringify(me));alert('저장되었습니다.')};$('savePrompt').onclick=()=>{sys=$('globalPrompt').value.trim();localStorage.setItem(K.SYS,sys);alert('저장되었습니다.')};$('saveEmoji').onclick=()=>{emojis=$('emojiPack').value.split(/[\s,]+/).filter(Boolean);localStorage.setItem(K.E,JSON.stringify(emojis));alert('저장되었습니다.')};$('notifOn').onchange=$('notifPreview').onchange=()=>{notif={on:$('notifOn').value,preview:$('notifPreview').value};localStorage.setItem(K.N,JSON.stringify(notif))};$('saveApi').onclick=()=>{if(!$('apiKey').value.trim())return alert('API 키를 입력하세요.');localStorage.setItem(K.KEY,$('apiKey').value.trim());localStorage.setItem(K.M,$('model').value);apiState();alert('API 설정이 저장되었습니다.')};$('saveTitle').onclick=()=>{title=$('titleInput').value.trim()||title;localStorage.setItem(K.T,title);document.title=title;alert('변경되었습니다.')};
$('fAvatar').onchange=e=>loadPic(e,'av','avPrev');$('fBg').onchange=e=>loadPic(e,'bg','bgPrev');$('fRef').onchange=e=>loadPic(e,'ref','refPrev');$('fmCancel').onclick=()=>$('friendModal').classList.remove('show');$('fmSave').onclick=saveFriend;$('saveRoom').onclick=saveRoom;$('deleteFriend').onclick=deleteFriend;$('banner').onclick=()=>{if($('banner').dataset.id)openChat($('banner').dataset.id)};
document.addEventListener('pointerdown',()=>lastAct=Date.now(),{passive:true});setInterval(autoCheck,30000)}
function apiState(){$('apiState').textContent=localStorage.getItem(K.KEY)?'API 키 저장됨 · '+(localStorage.getItem(K.M)||'gemini-3.7-flash'):'API 키 미설정'}
function openFM(id){let f=id?friend(id):null;$('friendModal').classList.add('show');$('fmTitle').textContent=f?'캐릭터 설정 및 기억':'새 친구';$('editId').value=f?.id||'';$('fName').value=f?.name||'';$('fStatus').value=f?.status||'';$('fAge').value=f?.age||'20대초반';$('fRegion').value=f?.region||'서울';$('fGender').value=f?.gender||'여성';$('appearance').value=f?.appearance||'';$('outfitMode').value=f?.outfitMode||'auto';$('outfitStyle').value=f?.outfitStyle||'';$('persona').value=f?.persona||'';$('bubbleStyle').value=f?.bubbleStyle||'short';$('autoMsg').value=f?.autoMsg||'on';$('autoImg').value=f?.autoImg||'off';$('memory').value=f?.memory||'처음 만난 사이';tmp={av:f?.avatar||blank,bg:f?.bg||blank,ref:f?.ref||''};[['avPrev',tmp.av],['bgPrev',tmp.bg],['refPrev',tmp.ref]].forEach(([i,s])=>{$(i).src=s;$(i).style.display=s?'block':'none'})}
function loadPic(e,k,p){let file=e.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{tmp[k]=r.result;$(p).src=r.result;$(p).style.display='block'};r.readAsDataURL(file)}
function saveFriend(){let name=$('fName').value.trim();if(!name)return alert('이름을 입력하세요.');let id=$('editId').value,data={name,status:$('fStatus').value.trim()||'안녕!',age:$('fAge').value,region:$('fRegion').value,gender:$('fGender').value,appearance:$('appearance').value.trim(),outfitMode:$('outfitMode').value,outfitStyle:$('outfitStyle').value.trim(),persona:$('persona').value.trim(),bubbleStyle:$('bubbleStyle').value,autoMsg:$('autoMsg').value,autoImg:$('autoImg').value,memory:$('memory').value.trim()||'서로 알아가는 중',avatar:tmp.av,bg:tmp.bg,ref:tmp.ref};if(id)Object.assign(friend(id),data);else friends.push({id:Date.now(),...data,action:true,pause:false,timeMode:'real',ddayDesc:'',ddayDate:'',lastAuto:0});save();$('friendModal').classList.remove('show');renderFriends();renderChats()}
function renderFriends(){let c=$('friendList');c.innerHTML='';if(!friends.length){c.innerHTML='<p class="sub" style="text-align:center;margin-top:50px">등록된 친구가 없습니다.</p>';return}friends.forEach(f=>{let d=document.createElement('div');d.className='list';d.innerHTML=`<img class="avatar" src="${f.avatar||blank}"><div class="info"><div class="name"></div><div class="sub"></div></div>`;d.querySelector('.name').textContent=f.name;d.querySelector('.sub').textContent=f.status;d.onclick=()=>openFMOrChat(f.id);c.appendChild(d)})}
function openFMOrChat(id){if(confirm('확인: 채팅방 열기\n취소: 친구 설정 열기'))openChat(id);else openFM(id)}
function renderChats(){let c=$('chatList');c.innerHTML='';friends.forEach(f=>{let h=hist[f.id]||[],m=h[h.length-1]||{text:'대화를 시작해보세요!',time:''},u=Number(unread[f.id]||0),d=document.createElement('div');d.className='list';d.innerHTML=`<img class="avatar" src="${f.avatar||blank}"><div class="info"><div class="name"></div><div class="sub"></div></div><div><div class="sub">${m.time||''}</div>${u?`<span class="badge">${u}</span>`:''}</div>`;d.querySelector('.name').textContent=f.name;d.querySelector('.info .sub').textContent=m.isImg?'[사진]':m.text;d.onclick=()=>openChat(f.id);c.appendChild(d)});let total=Object.values(unread).reduce((a,b)=>a+Number(b||0),0);$('unreadTotal').textContent=total?`(${total})`:''}
function openChat(id){let f=friend(id);if(!f)return;fid=f.id;unread[f.id]=0;if(!hist[f.id])hist[f.id]=[{sender:'recv',text:'안녕! 반가워 ㅎㅎ',time:time()}];save();$('chatAv').src=f.avatar||blank;$('chatName').textContent=f.name;showScreen('chat');$('nav').classList.remove('show');renderMsgs();lastAct=Date.now()}
function renderMsgs(){let c=$('msgs'),f=friend(fid);c.innerHTML='';(hist[fid]||[]).forEach(m=>{let r=document.createElement('div');r.className='msgrow '+(m.sender==='sent'?'sent':'recv');if(m.sender!=='sent'){let av=document.createElement('img');av.className='mini';av.src=f.avatar||blank;r.appendChild(av)}let w=document.createElement('div'),b=document.createElement('div'),t=document.createElement('div');b.className='bubble';t.className='time';t.textContent=m.time||'';if(m.isImg){let im=document.createElement('img');im.src=m.text;b.appendChild(im)}else b.textContent=m.text;w.append(b,t);r.appendChild(w);c.appendChild(r)});c.scrollTop=c.scrollHeight}
function systemPrompt(f){let outfit=f.outfitMode==='fixed'?`의상은 고정: ${f.outfitStyle||'설정된 의상'}`:`상황에 맞게 의상을 바꿀 수 있음. 취향: ${f.outfitStyle||'자유'}`,action=f.action?'필요할 때 괄호 행동 묘사를 자연스럽게 쓸 수 있다.':'괄호 행동 묘사를 쓰지 않는다.',style=f.bubbleStyle==='short'?'답변을 짧은 1~3개 말풍선으로 나누고 말풍선 사이는 ||| 로 구분한다.':'답변은 하나의 말풍선으로 쓰고 |||를 사용하지 않는다.',clock=f.timeMode==='fast'?'역할극 시간은 실제보다 빠르게 흐를 수 있다.':'실제 시간 흐름을 기준으로 한다.';return `${sys}\n\n[캐릭터]\n이름:${f.name}\n나이:${f.age}\n지역:${f.region}\n성별:${f.gender}\n상태:${f.status}\n외형:${f.appearance}\n${outfit}\n성격:${f.persona}\n기억:${f.memory}\n기념일:${f.ddayDesc||'없음'} ${f.ddayDate||''}\n\n[상대]\n이름:${me.name}\n나이:${me.age}\n지역:${me.region}\n성별:${me.gender}\n\n[규칙]\n이전 대화와 캐릭터 설정을 일관되게 유지한다. 메신저 친구처럼 자연스럽게 답한다. 메타 설명 없이 캐릭터의 말만 출력한다. ${action} ${style} ${clock}`}
function contents(id){return (hist[id]||[]).slice(-24).map(m=>({role:m.sender==='sent'?'user':'model',parts:[{text:m.isImg?'[사용자가 이미지를 보냈음]':String(m.text||'')}]}))}
function parseDataUrl(s){let m=String(s).match(/^data:([^;]+);base64,(.+)$/);return m?{mimeType:m[1],data:m[2]}:null}
async function ask(f,cs){let key=localStorage.getItem(K.KEY);if(!key)throw Error('Gemini API 키를 설정하세요.');let model=localStorage.getItem(K.M)||'gemini-3.7-flash',res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:systemPrompt(f)}]},contents:cs,generationConfig:{temperature:.9,maxOutputTokens:900}})}),data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data?.error?.message||`API 오류 ${res.status}`);let out=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();if(!out)throw Error('빈 응답입니다.');return out}
function split(out,f){return f.bubbleStyle==='short'?out.split(/\s*\|\|\|\s*/).map(x=>x.trim()).filter(Boolean).slice(0,3):[out.trim()]}
async function sendText(){let txt=$('text').value.trim(),f=friend(fid);if(!txt||!f)return;if(f.pause)return alert('톡이 일시 정지되어 있습니다.');if(!localStorage.getItem(K.KEY))return alert('설정에서 Gemini API 키를 저장하세요.');hist[f.id].push({sender:'sent',text:txt,time:time()});$('text').value='';save();renderMsgs();$('typing').classList.add('show');try{let out=await ask(f,contents(f.id));$('typing').classList.remove('show');for(let p of split(out,f)){hist[f.id].push({sender:'recv',text:p,time:time()});save();renderMsgs();await delay(350)}renderChats();autoImage(f,out).catch(console.warn)}catch(e){$('typing').classList.remove('show');hist[f.id].push({sender:'recv',text:'[API 오류] '+e.message,time:time()});save();renderMsgs()}}
async function sendPhoto(e){let file=e.target.files?.[0];e.target.value='';if(!file||!fid)return;let f=friend(fid);if(f.pause)return alert('톡이 일시 정지되어 있습니다.');let url=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});hist[f.id].push({sender:'sent',text:url,isImg:true,time:time()});save();renderMsgs();$('typing').classList.add('show');try{let cs=contents(f.id).slice(0,-1),inline=parseDataUrl(url);cs.push({role:'user',parts:[{text:'방금 보낸 이미지를 실제로 보고 내용과 대화 맥락에 맞춰 자연스럽게 답장해줘.'},...(inline?[{inlineData:inline}]:[])]});let out=await ask(f,cs);$('typing').classList.remove('show');split(out,f).forEach(p=>hist[f.id].push({sender:'recv',text:p,time:time()}));save();renderMsgs();renderChats()}catch(e){$('typing').classList.remove('show');hist[f.id].push({sender:'recv',text:'[사진 분석 오류] '+e.message,time:time()});save();renderMsgs()}}
async function autoImage(f,ctx){if(f.autoImg!=='on'||Math.random()>.08)return;let key=localStorage.getItem(K.KEY);if(!key)return;let parts=[{text:`${f.name}이 메신저에서 공유할 법한 실제 스마트폰 사진 한 장. 외형:${f.appearance}. 의상:${f.outfitStyle}. 현재 대화:${ctx.slice(0,400)}. 이미지에 글자는 넣지 않는다.`}];let ref=parseDataUrl(f.ref||'');if(ref)parts.push({inlineData:ref});let res=await fetch('https://generativelanguage.googleapis.com/v1/models/gemini-3.1-flash-image:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts}],generationConfig:{responseModalities:['IMAGE']}})});let data=await res.json().catch(()=>({}));if(!res.ok)return;let ip=data.candidates?.[0]?.content?.parts?.find(p=>p.inlineData?.data);if(!ip)return;let url=`data:${ip.inlineData.mimeType||'image/png'};base64,${ip.inlineData.data}`;hist[f.id].push({sender:'recv',text:url,isImg:true,time:time()});try{save()}catch{}renderMsgs();renderChats()}
function openDrawer(){let f=friend(fid);$('actionOn').value=f.action?'on':'off';$('pauseOn').value=f.pause?'on':'off';$('timeMode').value=f.timeMode||'real';$('ddayDesc').value=f.ddayDesc||'';$('ddayDate').value=f.ddayDate||'';dday(f);$('drawer').classList.add('show')}
function dday(f){if(!f.ddayDate)return $('ddayInfo').textContent='등록된 기념일 없음';let a=new Date(f.ddayDate+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);let n=Math.round((a-b)/86400000);$('ddayInfo').textContent=`${f.ddayDesc||'기념일'} · ${n===0?'D-Day':n>0?'D-'+n:'D+'+Math.abs(n)}`}
function saveRoom(){let f=friend(fid);f.action=$('actionOn').value==='on';f.pause=$('pauseOn').value==='on';f.timeMode=$('timeMode').value;f.ddayDesc=$('ddayDesc').value.trim();f.ddayDate=$('ddayDate').value;save();dday(f);alert('채팅방 설정이 저장되었습니다.')}
function deleteFriend(){if(!confirm('정말 삭제할까요?'))return;let id=fid;friends=friends.filter(x=>String(x.id)!==String(id));delete hist[id];delete unread[id];save();$('drawer').classList.remove('show');fid=null;showScreen('friends');$('nav').classList.add('show');renderFriends();renderChats()}
function openEmoji(){$('emojiGrid').innerHTML='';emojis.forEach(x=>{let b=document.createElement('button');b.className='emojiBtn';b.textContent=x;b.onclick=()=>{$('emojiModal').classList.remove('show');$('text').value=x;sendText()};$('emojiGrid').appendChild(b)});$('emojiModal').classList.add('show')}
function renderGallery(){let c=$('galleryBody'),arr=[];Object.values(hist).forEach(h=>(h||[]).forEach(m=>m.isImg&&arr.push(m.text)));if(!arr.length){c.innerHTML='<p class="sub" style="text-align:center;margin-top:50px">주고받은 사진이 없습니다.</p>';return}c.innerHTML='<div class="gallery"></div>';arr.forEach(s=>{let i=document.createElement('img');i.src=s;c.firstChild.appendChild(i)})}
function notify(f,text){if(notif.on==='off'||fid===f.id)return;$('banAv').src=f.avatar||blank;$('banName').textContent=f.name;$('banText').textContent=notif.preview==='content'?String(text).replace(/\|\|\|/g,' ').slice(0,100):'새로운 메시지가 도착했습니다';$('banner').dataset.id=f.id;$('banner').classList.add('show');setTimeout(()=>$('banner').classList.remove('show'),4000)}
async function autoCheck(){if(autoBusy||Date.now()-lastAct<120000||!localStorage.getItem(K.KEY))return;let pool=friends.filter(f=>f.autoMsg==='on'&&!f.pause&&Date.now()-Number(f.lastAuto||0)>600000);if(!pool.length)return;let f=pool[Math.floor(Math.random()*pool.length)];autoBusy=true;try{let cs=contents(f.id);cs.push({role:'user',parts:[{text:'[시스템 이벤트] 상대가 한동안 말이 없다. 이전 대화에 어울리게 캐릭터가 먼저 자연스럽고 짧은 선톡을 보내.'}]});let out=await ask(f,cs);hist[f.id]=hist[f.id]||[];split(out,f).forEach(p=>hist[f.id].push({sender:'recv',text:p,time:time()}));f.lastAuto=Date.now();if(fid!==f.id)unread[f.id]=(unread[f.id]||0)+1;save();if(fid===f.id)renderMsgs();renderChats();notify(f,out)}catch(e){console.warn(e)}finally{autoBusy=false;lastAct=Date.now()}}
init()
})();
</script>
</body></html>
