<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">

<title>나만의 AI 메신저</title>

<style>

:root{
--bg:#f1f4f7;
--card:#fff;
--text:#191919;
--sub:#8b9098;
--line:#e8e9ed;
--accent:#5b74f8;
--mine:#dbe6ff;
--ai:#fff;
--danger:#dd4747;
}

*{
box-sizing:border-box;
}

html,
body{
margin:0;
height:100%;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
"Noto Sans KR",
sans-serif;
background:#e9eaee;
color:var(--text);
}

button,
input,
textarea,
select{
font:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}


/* ===============================
APP
=============================== */

#app{
width:min(720px,100%);
height:100dvh;
margin:auto;
position:relative;
overflow:hidden;
background:#fff;
}


/* ===============================
MAIN HEADER
=============================== */

.main-header{
height:58px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;

background:#fff;

border-bottom:
1px solid var(--line);
}

.main-header h1{
margin:0;
font-size:20px;
}

.icon-btn{
border:0;
background:none;

font-size:25px;

padding:8px;

color:var(--accent);
}


/* ===============================
MAIN VIEW
=============================== */

.view{

display:none;

height:
calc(100dvh - 118px);

overflow-y:auto;

padding:14px;

}

.view.active{
display:block;
}


/* ===============================
BOTTOM NAV
=============================== */

.nav{

position:absolute;

bottom:0;
left:0;
right:0;

height:60px;

display:grid;

grid-template-columns:
repeat(3,1fr);

background:#fff;

border-top:
1px solid var(--line);

}

.nav button{

border:0;

background:#fff;

color:#90939a;

font-size:12px;

}

.nav button.active{

color:var(--accent);

font-weight:700;

}


/* ===============================
FRIEND LIST
=============================== */

.friend-row,
.chat-row{

display:flex;

align-items:center;

gap:12px;

padding:13px 5px;

border-bottom:
1px solid #f0f1f3;

}

.avatar{

width:52px;
height:52px;

border-radius:50%;

background:#e9edff;

display:flex;

align-items:center;
justify-content:center;

overflow:hidden;

font-weight:800;

flex:none;

}

.avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.row-info{

min-width:0;

flex:1;

}

.row-info strong,
.row-info small{

display:block;

}

.row-info small{

margin-top:4px;

color:var(--sub);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.empty{

text-align:center;

color:#999;

padding:70px 20px;

}


/* ===============================
PROFILE PAGE
=============================== */

#profilePage{

position:absolute;

inset:0;

background:#fff;

z-index:15;

overflow:auto;

}

.profile-hero{

position:relative;

height:270px;

background:
linear-gradient(
150deg,
#e8edff,
#f7f8ff
);

overflow:hidden;

}

.profile-bg-img{

width:100%;
height:100%;

object-fit:cover;

filter:brightness(.9);

}

.profile-back{

position:absolute;

left:12px;
top:max(
10px,
env(safe-area-inset-top)
);

z-index:2;

width:42px;
height:42px;

border:0;

border-radius:50%;

background:#ffffffdd;

font-size:28px;

}

.profile-body{

padding:
0 20px 30px;

text-align:center;

}

.profile-avatar{

width:106px;
height:106px;

margin:
-53px auto 10px;

position:relative;

border-radius:50%;

border:
4px solid #fff;

background:#e9edff;

overflow:hidden;

display:grid;

place-items:center;

font-size:30px;

font-weight:800;

}

.profile-avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.profile-name{

font-size:24px;

font-weight:800;

}

.profile-status{

color:#777;

margin-top:6px;

min-height:22px;

}

.profile-meta{

color:#999;

font-size:14px;

margin-top:8px;

}

.profile-actions{

display:flex;

justify-content:center;

gap:10px;

margin-top:22px;

}

.profile-actions button{

min-width:130px;

}

.profile-detail{

max-width:520px;

margin:
28px auto 0;

padding:15px;

background:#fafafa;

border-radius:16px;

text-align:left;

}

.profile-detail p{

color:#555;

line-height:1.55;

white-space:pre-wrap;

}


/* ===============================
CHAT ROOM
=============================== */

#chatRoom{

position:absolute;

inset:0;

z-index:20;

background:var(--bg);

display:flex;

flex-direction:column;

}

.chat-header{

height:58px;

flex:none;

background:#fff;

border-bottom:
1px solid var(--line);

display:flex;

align-items:center;

padding:0 8px;

gap:8px;

}

.chat-title{

flex:1;

min-width:0;

}

.chat-title strong,
.chat-title small{

display:block;

}

.chat-title small{

color:#999;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}


/* ===============================
MESSAGES
=============================== */

#messageList{

flex:1;

overflow-y:auto;

padding:
16px 12px 22px;

display:flex;

flex-direction:column;

}

.message-row{

display:flex;

align-items:flex-start;

gap:8px;

margin-top:4px;

}

.message-row.mine{

justify-content:flex-end;

}

.message-row.ai{

justify-content:flex-start;

}


/* AI PROFILE CIRCLE */

.chat-avatar-slot{

width:38px;

flex:
0 0 38px;

}

.chat-avatar{

width:38px;
height:38px;

border-radius:50%;

overflow:hidden;

background:#e1e7f7;

display:grid;

place-items:center;

font-weight:800;

font-size:12px;

}

.chat-avatar img{

width:100%;
height:100%;

object-fit:cover;

}


/* BUBBLES */

.bubble-wrap{

max-width:76%;

display:flex;

align-items:flex-end;

gap:6px;

}

.message-row.mine
.bubble-wrap{

flex-direction:row-reverse;

}

.message{

width:fit-content;

max-width:100%;

padding:
9px 12px;

border-radius:17px;

line-height:1.45;

white-space:pre-wrap;

word-break:break-word;

box-shadow:
0 1px 2px
rgba(0,0,0,.03);

}

.message.ai{

background:var(--ai);

}

.message.mine{

background:var(--mine);

}

.message img{

display:block;

max-width:100%;

border-radius:12px;

}


/* TIME */

.time{

font-size:10px;

color:#9b9ea5;

white-space:nowrap;

padding-bottom:2px;

}

.time.invisible{

visibility:hidden;

}


/* GROUPED MESSAGES */

.message-row.group-middle,
.message-row.group-last{

margin-top:2px;

}

.message-row.ai.group-middle
.chat-avatar,

.message-row.ai.group-last
.chat-avatar{

visibility:hidden;

}


/* ===============================
COMPOSER
=============================== */

.composer{

flex:none;

min-height:64px;

background:#fff;

display:flex;

align-items:flex-end;

gap:7px;

padding:8px;

border-top:
1px solid var(--line);

}

.composer textarea{

flex:1;

resize:none;

max-height:120px;

border-radius:20px;

margin:0;

}

.send{

border:0;

background:var(--accent);

color:#fff;

border-radius:14px;

padding:
10px 14px;

}

.typing{

margin-left:46px;

width:fit-content;

background:#fff;

color:#888;

padding:
9px 13px;

border-radius:16px;

margin-top:5px;

}


/* ===============================
FORM
=============================== */

.card{

background:#fafafa;

border-radius:16px;

padding:15px;

margin-bottom:13px;

}

.card h3{

margin:
0 0 12px;

}

.card label,
.form-label{

display:block;

margin:11px 0;

}

input,
textarea,
select{

width:100%;

border:
1px solid #dfe1e5;

border-radius:11px;

padding:10px;

background:#fff;

margin-top:5px;

outline:none;

}

textarea{

resize:vertical;

}

.check{

display:flex!important;

align-items:center;

gap:8px;

}

.check input{

width:auto;

margin:0;

}


/* ===============================
BUTTONS
=============================== */

.primary,
.secondary,
.danger{

border-radius:11px;

padding:
10px 14px;

}

.primary{

border:0;

background:var(--accent);

color:#fff;

}

.secondary{

border:
1px solid #ddd;

background:#fff;

}

.danger{

border:
1px solid #ffd0d0;

background:#fff5f5;

color:var(--danger);

}


/* ===============================
SIDE DRAWER
=============================== */

.drawer-backdrop{

position:absolute;

inset:0;

background:#0005;

z-index:40;

opacity:0;

pointer-events:none;

transition:.2s;

}

.drawer-backdrop.open{

opacity:1;

pointer-events:auto;

}

.drawer{

position:absolute;

right:0;
top:0;
bottom:0;

width:min(
330px,
86%
);

background:#fff;

z-index:41;

transform:
translateX(100%);

transition:.25s;

box-shadow:
-8px 0 25px #0002;

padding-top:
env(safe-area-inset-top);

overflow-y:auto;

}

.drawer.open{

transform:
translateX(0);

}

.drawer-head{

height:58px;

display:flex;

align-items:center;

justify-content:space-between;

padding:
0 16px;

border-bottom:
1px solid var(--line);

}

.drawer-section{

padding:16px;

border-bottom:
1px solid var(--line);

}

.drawer-section h4{

margin:
0 0 12px;

}

.drawer-action{

width:100%;

text-align:left;

padding:
13px 10px;

border:0;

background:#fff;

border-radius:10px;

}

.drawer-dday{

font-size:24px;

font-weight:800;

color:var(--accent);

margin:
8px 0;

}


/* ===============================
ROOM GALLERY
=============================== */

#roomGallery{

position:absolute;

inset:0;

z-index:45;

background:#fff;

display:flex;

flex-direction:column;

}

.sub-header{

height:58px;

display:flex;

align-items:center;

gap:8px;

border-bottom:
1px solid var(--line);

padding:
0 8px;

}

.sub-header h2{

font-size:19px;

margin:0;

}

.gallery{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:3px;

padding:3px;

overflow-y:auto;

}

.gallery img{

width:100%;

aspect-ratio:1;

object-fit:cover;

background:#eee;

}


/* ===============================
MODAL
=============================== */

.modal{

position:fixed;

inset:0;

background:#0007;

display:flex;

align-items:center;

justify-content:center;

padding:14px;

z-index:100;

}

.modal-box{

width:min(
570px,
100%
);

max-height:90dvh;

overflow:auto;

background:#fff;

border-radius:20px;

padding:19px;

}

.modal-box h2{

margin-top:0;

}

.modal-actions{

display:flex;

justify-content:flex-end;

gap:8px;

margin-top:18px;

}

.two{

display:grid;

grid-template-columns:
1fr 1fr;

gap:9px;

}

.image-input-row{

display:grid;

grid-template-columns:
82px 1fr;

gap:12px;

align-items:center;

}

.image-preview{

width:82px;
height:82px;

border-radius:18px;

background:#f0f1f4;

overflow:hidden;

display:grid;

place-items:center;

color:#aaa;

font-size:12px;

}

.image-preview.circle{

border-radius:50%;

}

.image-preview img{

width:100%;
height:100%;

object-fit:cover;

}


/* ===============================
VIEWER
=============================== */

#viewer{

position:fixed;

inset:0;

background:#000e;

z-index:300;

display:flex;

align-items:center;

justify-content:center;

}

#viewer img{

max-width:96%;
max-height:92%;

object-fit:contain;

}

.viewer-close{

position:absolute;

right:16px;
top:16px;

width:42px;
height:42px;

border-radius:50%;

border:0;

background:#333;

color:#fff;

font-size:24px;

}


/* ===============================
VERSION / STATUS
=============================== */

.version{

display:flex;

justify-content:space-between;

color:#777;

}

.status-ok{

color:#269146;

font-size:13px;

}

.status-error{

color:#d33;

font-size:13px;

}

@media(max-width:500px){

.two{

grid-template-columns:1fr;

}

.profile-hero{

height:230px;

}

.profile-actions button{

min-width:118px;

}

}

</style>
</head>


<body>


<div id="app">


<header class="main-header">

<h1 id="appTitle">
나만의 AI 메신저
</h1>

<button
id="addFriendBtn"
class="icon-btn"
>
＋
</button>

</header>


<section
id="friendsView"
class="view active"
></section>


<section
id="chatsView"
class="view"
></section>


<section
id="settingsView"
class="view"
></section>


<nav class="nav">

<button
class="active"
data-tab="friends"
>
👥<br>친구
</button>

<button
data-tab="chats"
>
💬<br>대화
</button>

<button
data-tab="settings"
>
⚙️<br>설정
</button>

</nav>



<!-- ===============================
FRIEND PROFILE
=============================== -->


<section
id="profilePage"
class="hidden"
>

<div
id="profileHero"
class="profile-hero"
>

<button
class="profile-back"
onclick="closeProfile()"
>
‹
</button>

<img
id="profileBackground"
class="profile-bg-img hidden"
>

</div>


<div class="profile-body">


<div
id="profileAvatar"
class="profile-avatar"
></div>


<div
id="profileName"
class="profile-name"
></div>


<div
id="profileStatus"
class="profile-status"
></div>


<div
id="profileMeta"
class="profile-meta"
></div>


<div class="profile-actions">

<button
class="primary"
onclick="chatFromProfile()"
>
💬 채팅하기
</button>

<button
class="secondary"
onclick="editProfileFriend()"
>
⚙️ 친구 설정
</button>

</div>


<div class="profile-detail">

<strong>
캐릭터 소개
</strong>

<p id="profilePersona"></p>

</div>


</div>

</section>



<!-- ===============================
CHAT ROOM
=============================== -->


<section
id="chatRoom"
class="hidden"
>


<div class="chat-header">

<button
id="backBtn"
class="icon-btn"
>
‹
</button>


<div class="chat-title">

<strong id="chatName"></strong>

<small id="chatStatus"></small>

</div>


<button
id="roomMenuBtn"
class="icon-btn"
>
☰
</button>

</div>



<div id="messageList"></div>



<div class="composer">

<button
id="plusBtn"
class="icon-btn"
>
＋
</button>

<textarea
id="messageInput"
rows="1"
placeholder="메시지를 입력하세요"
></textarea>

<button
id="sendBtn"
class="send"
>
전송
</button>

</div>



<!-- DRAWER -->


<div
id="drawerBackdrop"
class="drawer-backdrop"
onclick="closeDrawer()"
></div>


<aside
id="roomDrawer"
class="drawer"
>


<div class="drawer-head">

<strong id="drawerFriendName">
채팅방
</strong>

<button
class="icon-btn"
onclick="closeDrawer()"
>
×
</button>

</div>



<div class="drawer-section">

<h4>
채팅방
</h4>

<button
class="drawer-action"
onclick="openRoomGallery()"
>
🖼️ 사진 모아보기
</button>

<button
class="drawer-action"
onclick="openFriendFromDrawer()"
>
👤 친구 프로필
</button>

<button
class="drawer-action"
onclick="editFriendFromDrawer()"
>
⚙️ 친구 설정
</button>

</div>



<div class="drawer-section">

<h4>
대화 설정
</h4>


<label class="check">

<input
id="actionDescriptions"
type="checkbox"
>

행동 괄호 묘사

</label>


<label class="check">

<input
id="roomPaused"
type="checkbox"
>

톡 정지

</label>


<label>

시간 흐름

<select id="timeMode">

<option value="realtime">
실시간
</option>

<option value="accelerated">
시간 가속
</option>

</select>

</label>


</div>



<div class="drawer-section">

<h4>
기념일
</h4>


<label>

기념일 이름

<input id="ddayLabel">

</label>


<label>

기념일 날짜

<input
id="ddayDate"
type="date"
>

</label>


<div
id="drawerDday"
class="drawer-dday"
></div>


<button
class="primary"
style="width:100%"
onclick="saveRoomSettings()"
>
채팅방 설정 저장
</button>


</div>



<div class="drawer-section">

<button
class="danger"
style="width:100%"
onclick="deleteCurrentFriend()"
>
친구 삭제
</button>

</div>


</aside>



<!-- ROOM GALLERY -->


<section
id="roomGallery"
class="hidden"
>


<div class="sub-header">

<button
class="icon-btn"
onclick="closeRoomGallery()"
>
‹
</button>

<h2>
사진 모아보기
</h2>

</div>


<div
id="roomGalleryGrid"
class="gallery"
></div>


</section>


</section>



</div>



<!-- ===============================
FILE INPUTS
=============================== -->


<input
id="photoInput"
type="file"
accept="image/*"
class="hidden"
>


<input
id="friendAvatarInput"
type="file"
accept="image/*"
class="hidden"
>


<input
id="friendReferenceInput"
type="file"
accept="image/*"
class="hidden"
>


<input
id="friendBackgroundInput"
type="file"
accept="image/*"
class="hidden"
>



<!-- ===============================
FRIEND EDIT MODAL
=============================== -->


<div
id="friendModal"
class="modal hidden"
>


<div class="modal-box">


<h2>
친구 설정
</h2>


<input
id="friendId"
type="hidden"
>


<label>

이름

<input id="friendName">

</label>


<label>

상태 메시지

<input id="friendStatus">

</label>



<div class="two">


<label>

생일

<input
id="friendBirthday"
type="date"
>

</label>


<label>

성별

<input
id="friendGender"
placeholder="예: 남성"
>

</label>


</div>



<label>

지역

<input id="friendRegion">

</label>



<label class="form-label">
프로필 사진
</label>


<div class="image-input-row">


<div
id="friendAvatarPreview"
class="image-preview circle"
>
없음
</div>


<div>

<button
class="secondary"
onclick="pickFriendAvatar()"
>
프로필 사진 선택
</button>

<button
class="secondary"
onclick="clearPendingImage('avatar')"
>
지우기
</button>

</div>


</div>



<label class="form-label">
프로필 배경 사진
</label>


<div class="image-input-row">


<div
id="friendBackgroundPreview"
class="image-preview"
>
없음
</div>


<div>

<button
class="secondary"
onclick="pickFriendBackground()"
>
배경 사진 선택
</button>

<button
class="secondary"
onclick="clearPendingImage('background')"
>
지우기
</button>

</div>


</div>



<label>

외형 고정 사항

<textarea
id="friendAppearance"
rows="4"
placeholder="머리, 눈, 얼굴형, 체형 등"
></textarea>

</label>



<label class="form-label">
외형 참고 이미지
</label>


<div class="image-input-row">


<div
id="friendReferencePreview"
class="image-preview"
>
없음
</div>


<div>

<button
class="secondary"
onclick="pickFriendReference()"
>
참고 이미지 선택
</button>

<button
class="secondary"
onclick="clearPendingImage('reference')"
>
지우기
</button>

</div>


</div>



<label>

의상 취향

<textarea
id="friendOutfit"
rows="3"
></textarea>

</label>



<label>

성격 / 말투 / 관계 설정

<textarea
id="friendPersona"
rows="6"
></textarea>

</label>



<label>

대화 방식

<select id="friendBubble">

<option value="split">
카톡처럼 여러 말풍선
</option>

<option value="long">
한 번에 길게
</option>

</select>

</label>



<label class="check">

<input
id="friendAutoImage"
type="checkbox"
>

자연스러울 때 AI가 사진 보내기

function fileToDataURL(

return new Promise(

(
resolve,
reject
)=>{

const reader=
new FileReader();

reader.onload=
()=>resolve(
reader.result
);

reader.onerror=
reject;

reader.readAsDataURL(

);

}

);

}



async function resizeImageFile(

file,

maxSize=900,

quality=.84

){

const src=
await fileToDataURL(
file
);


const image=
await new Promise(

(
resolve,
reject
)=>{

const img=
new Image();

img.onload=
()=>resolve(img);

img.onerror=
reject;

img.src=
src;

}

);


let width=
image.width;

let height=
image.height;


if(
Math.max(
width,
height
)
>
maxSize
){

const ratio=

maxSize
/
Math.max(
width,
height
);

width=
Math.round(
width*ratio
);

height=
Math.round(
height*ratio
);

}


const canvas=
document.createElement(
"canvas"
);

canvas.width=
width;

canvas.height=
height;


canvas
.getContext("2d")
.drawImage(

image,

0,
0,

width,
height

);


return canvas.toDataURL(

"image/jpeg",

quality

);

}

/* ===============================

function messageGroupPosition(
messages,
index
){

const current=
messages[index];

const previous=
messages[index-1];

const next=
messages[index+1];


const samePrevious=

previous

&&

previous.role===
current.role

&&

previous.groupId

&&

current.groupId

&&

previous.groupId===
current.groupId;


const sameNext=

next

&&

next.role===
current.role

&&

next.groupId

&&

current.groupId

&&

next.groupId===
current.groupId;


if(
!samePrevious
&&
sameNext
)
return "first";


if(
samePrevious
&&
sameNext
)
return "middle";


if(
samePrevious
&&
!sameNext
)
return "last";


return "single";

}

.filter(

const contents=

message=>({

role:

message.role==="assistant"
?
"model"
:
"user",

parts:[

text:

}

]

})

);



const friendAge=
ageFromBirthday(
friend.birthday
);


const userAge=

state.settings.user.birthday
);



const systemPrompt=`

당신은 1:1 메신저 안에서 사용자와 자연스럽게 대화하는 가상의 AI 캐릭터다.

[캐릭터]

이름:
${friend.name}

생일:
${friend.birthday||"미설정"}

나이:
${
friendAge!==""
?
friendAge+"세"
:
"미설정"
}

성별:
${friend.gender||"미설정"}

지역:
${friend.region||"미설정"}

상태 메시지:
${friend.status||""}

외형 고정 사항:
${friend.appearance||""}

의상 취향:
${friend.outfit||""}

성격 / 말투 / 관계:
${friend.persona||""}


[사용자]

닉네임:
${state.settings.user.nickname||"사용자"}

생일:
${state.settings.user.birthday||"미설정"}

나이:
${
userAge!==""
?
userAge+"세"
:
"미설정"
}

성별:
${state.settings.user.gender||"미설정"}

지역:
${state.settings.user.region||"미설정"}


[장기 기억]

${friend.memory||"아직 저장된 장기 기억 없음"}


[전역 규칙]

${state.settings.globalPrompt||""}


[현재 채팅방]

행동 괄호 묘사:
${room.actionDescriptions?"허용":"사용하지 않음"}

시간 흐름:
${room.timeMode}

기념일:
${room.ddayLabel||""}
${room.ddayDate||""}

말풍선 방식:
${friend.bubbleStyle}

자율 이미지:
${friend.autoImage?"허용":"사용하지 않음"}


반드시 JSON 하나만 반환한다.

{
"messages":[
"첫 말풍선",
"두 번째 말풍선"
],
"imagePrompt":null
}

규칙:

- messages는 1~5개.
- split이면 실제 메신저처럼 자연스럽게 여러 말풍선으로 나눈다.
- long이면 가급적 한 말풍선으로 답한다.
- 지나치게 무성의한 단답만 반복하지 않는다.
- 행동 묘사가 꺼져 있으면 괄호 행동 묘사를 쓰지 않는다.
- 자율 이미지가 켜져 있고 실제 사진을 보내는 흐름이 자연스러울 때만 imagePrompt를 작성한다.
- 사진이 필요 없다면 imagePrompt는 null이다.
- JSON 외의 다른 설명은 출력하지 않는다.

`.trim();



const response=

await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/${TEXT_MODEL}:generateContent`,

{

method:
"POST",

headers:{

"Content-Type":
"application/json",

"x-goog-api-key":
key

},

body:
JSON.stringify({

systemInstruction:{

parts:[

{

text:
systemPrompt

}

]

},

contents,

generationConfig:{

temperature:
.9,

responseMimeType:
"application/json",

maxOutputTokens:
1800

}

})

}

);



if(
!response.ok
){

throw new Error(

await response.text()

);

}



const data=
await response.json();



let text=

data
?.candidates
?.[0]
?.content
?.parts
?.map(
part=>
part.text||""
)
.join("")
.trim();



if(
!text
){

throw new Error(
"Gemini에서 텍스트 응답이 오지 않았습니다."
);

}



text=

text
.replace(
/^```json/i,
""
)
.replace(
/```$/i,
""
)
.trim();



let parsed;


try{

parsed=
JSON.parse(text);

}catch{

parsed={

messages:[
text
],

imagePrompt:
null

};

}



if(

!Array.isArray(
parsed.messages
)

||

!parsed.messages.length

){

parsed.messages=[

"답장을 생성하지 못했어요."

];

}



parsed.messages=

parsed.messages
.slice(
0,
5
)
.map(String);



return parsed;

}



/* ===============================

async function generateAIImage(

imagePrompt,

friend,

groupId=uuid()

){

const key=
state.settings.apiKey;



const prompt=`

Create a natural fictional messenger photo of the same character.

Character appearance:

${friend.appearance||""}

Clothing preference:

${friend.outfit||""}

Current scene:

${imagePrompt}

Maintain the same character identity.

Do not add text.
Do not add a watermark.
Do not add messaging UI.

`.trim();



const parts=[

{

text:
prompt

}

];



/*
외형 참고 이미지가 있으면
Gemini 이미지 요청에도 같이 전달
*/

if(
friend.referenceImage
){

const match=

friend.referenceImage
.match(

/^data:(.*?);base64,(.*)$/

);


if(match){

parts.push({

inlineData:{

mimeType:
match[1],

data:
match[2]

}

});

}

}



const response=

await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/${IMAGE_MODEL}:generateContent`,

{

method:
"POST",

headers:{

"Content-Type":
"application/json",

"x-goog-api-key":
key

},

body:
JSON.stringify({

contents:[

{

role:
"user",

parts

}

],

generationConfig:{

responseModalities:[

"TEXT",

"IMAGE"

]

}

})

}

);



if(
!response.ok
){

throw new Error(

await response.text()

);

}



const data=
await response.json();



const resultParts=

data
?.candidates
?.[0]
?.content
?.parts

||

[];



const imagePart=

resultParts.find(

part=>
part.inlineData?.data

);



if(
!imagePart
){

throw new Error(
"이미지가 반환되지 않았습니다."
);

}



const mime=

imagePart
.inlineData
.mimeType

||

"image/png";



const image=

`data:${mime};base64,`

+

imagePart
.inlineData
.data;



getMessages(
friend.id
)
.push({

id:
uuid(),

groupId,

role:
"assistant",

type:
"image",

data:
image,

time:
new Date()
.toISOString()

});



saveAll();

renderMessages();

}

function updateDday(){

const date=

document
.getElementById(
"ddayDate"
)
.value;


const target=

document
.getElementById(
"drawerDday"
);


if(
!date
){

target.textContent="";

return;

}



const today=
new Date();

today.setHours(
0,
0,
0,
0
);


const eventDate=

new Date(
date+"T00:00:00"
);


const days=

Math.round(

(
eventDate-today
)

/86400000

);



if(
days===0
){

target.textContent=
"D-DAY";

}else if(
days>0
){

target.textContent=
"D-"+days;

}else{

target.textContent=
"D+"+Math.abs(days);

}

}
